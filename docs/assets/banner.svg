<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tagrove — AI metadata for Adobe Stock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#111826"/>
      <stop offset="1" stop-color="#1A2334"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9CF8"/>
      <stop offset="0.5" stop-color="#6E7FF3"/>
      <stop offset="1" stop-color="#62A8FA"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D8CF5"/>
      <stop offset="1" stop-color="#5468E7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6E7FF3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6E7FF3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.03"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="250" y="178" height="56" width="0">
        <animate attributeName="width" values="0;830;830;0" keyTimes="0;0.42;0.86;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="bannerClip">
      <rect x="8" y="8" width="1184" height="304" rx="22"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#bg)" stroke="#232A36"/>
  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#grid)"/>

  <!-- Ambient orbs -->
  <g clip-path="url(#bannerClip)">
    <circle cx="180" cy="70" r="90" fill="#6E7FF3" opacity="0.10" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="250" r="120" fill="#62A8FA" opacity="0.08" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 16;0 0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="60" r="60" fill="#3ECF8E" opacity="0.07" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Logo: pulsing glow + tag + orbiting sparkle -->
  <ellipse cx="150" cy="160" rx="115" ry="115" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <g transform="translate(150 160)">
    <g transform="rotate(-18)">
      <rect x="-48" y="-32" width="96" height="64" rx="16" fill="url(#tagGrad)"/>
      <circle cx="-20" cy="-10" r="9" fill="#0B0F17"/>
      <rect x="-6" y="6" width="40" height="7" rx="3.5" fill="#0B0F17" opacity="0.35"/>
      <rect x="-6" y="18" width="26" height="7" rx="3.5" fill="#0B0F17" opacity="0.22"/>
    </g>
    <g transform="translate(40 -34)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <path d="M0 -11 L2.8 -2.8 11 0 2.8 2.8 0 11 -2.8 2.8 -11 0 -2.8 -2.8 Z" fill="#E8E2FF">
          <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- Title + typing subtitle + cursor -->
  <text x="250" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">Tagrove</text>
  <text x="252" y="214" font-family="Cascadia Mono, Consolas, monospace" font-size="24" fill="#9AA4B8" clip-path="url(#typeClip)">Import → Generate → Review → Export · Adobe Stock metadata, automated.</text>
  <rect x="252" y="188" width="3" height="34" rx="1.5" fill="#7D8CF5">
    <animate attributeName="x" values="252;1082;1082;252" keyTimes="0;0.42;0.86;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <rect x="250" y="244" width="158" height="32" rx="16" fill="#141B27" stroke="#3A445A"/>
    <circle cx="272" cy="260" r="4" fill="#3ECF8E">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="286" y="265" fill="#C7CEDC">v1.0.0 · stable</text>

    <rect x="422" y="244" width="186" height="32" rx="16" fill="#141B27" stroke="#3A445A"/>
    <path d="M444 252 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#8E9CF8">
      <animateTransform attributeName="transform" type="rotate" from="0 444 260" to="360 444 260" dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="458" y="265" fill="#C7CEDC">Gemini vision AI</text>
  </g>

  <!-- Floating mini rows (right) -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="880" y="96" width="250" height="46" rx="10" fill="#131A26" stroke="#232A36"/>
      <rect x="892" y="106" width="26" height="26" rx="6" fill="#1E2839"/>
      <rect x="930" y="110" width="120" height="7" rx="3.5" fill="#2A3346"/>
      <rect x="930" y="124" width="80" height="7" rx="3.5" fill="#222B3D"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="880" y="152" width="250" height="46" rx="10" fill="#131A26" stroke="#232A36"/>
      <rect x="892" y="162" width="26" height="26" rx="6" fill="#1E2839"/>
      <rect x="930" y="166" width="100" height="7" rx="3.5" fill="#2A3346"/>
      <rect x="930" y="180" width="70" height="7" rx="3.5" fill="#222B3D"/>
      <rect x="1000" y="164" width="18" height="7" rx="3.5" fill="#3ECF8E" opacity="0.6"/>
      <rect x="1024" y="164" width="14" height="7" rx="3.5" fill="#3ECF8E" opacity="0.4"/>
      <g transform="translate(1104 175)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="1.8s" repeatCount="indefinite"/>
          <circle r="11" fill="#3ECF8E" opacity="0.15"/>
          <circle r="11" fill="none" stroke="#3ECF8E" stroke-width="1.5"/>
          <path d="M-5 0 l3.5 3.5 7 -7" stroke="#3ECF8E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="880" y="208" width="250" height="46" rx="10" fill="#131A26" stroke="#232A36"/>
      <rect x="892" y="218" width="26" height="26" rx="6" fill="#1E2839"/>
      <rect x="930" y="222" width="110" height="7" rx="3.5" fill="#2A3346"/>
      <rect x="930" y="236" width="76" height="7" rx="3.5" fill="#222B3D"/>
    </g>
    <g transform="translate(1005 175)">
      <circle r="96" fill="none" stroke="#6E7FF3" stroke-width="1.2" stroke-dasharray="3 9" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Shimmer sweep -->
  <g clip-path="url(#bannerClip)">
    <rect x="-220" y="8" width="200" height="304" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1420 0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
