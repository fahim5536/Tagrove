<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Animated strip: a filename becomes a generated title and keyword set, ending in an Adobe Stock ready badge">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C111C"/>
      <stop offset="1" stop-color="#141C2E"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="232" y="26" height="28" width="0">
        <animate attributeName="width" values="0;0;372;372" keyTimes="0;0.06;0.46;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      text { font-family: "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.94;1" dur="6s" repeatCount="indefinite"/>
    <rect width="1200" height="96" rx="14" fill="url(#tbg)" stroke="#1E2739"/>

    <!-- source file -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="6s" repeatCount="indefinite"/>
      <rect x="24" y="34" width="28" height="28" rx="6" fill="#16203A" stroke="#26314C"/>
      <circle cx="33" cy="43" r="2.6" fill="#4A5878"/>
      <path d="M27 58 L34 47 L39 53 L42 49 L46 58 Z" fill="#3E4C6B"/>
      <text x="62" y="53" font-size="13" fill="#8B96AC">sunset-01.jpg</text>
      <text x="196" y="54" font-size="15" fill="#4A5878">→</text>
    </g>

    <!-- typed title -->
    <text x="232" y="52" font-size="15" fill="#E8ECF5" clip-path="url(#typeClip)">Golden retriever running through a park at sunset</text>
    <rect y="38" width="2" height="18" fill="#6E7FF3">
      <animate attributeName="x" values="232;232;604;604" keyTimes="0;0.06;0.46;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.06;0.12;0.80;0.84;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- keyword pills -->
    <g font-size="11" fill="#A9B6D6">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="6s" repeatCount="indefinite"/>
        <rect x="232" y="66" width="56" height="20" rx="10" fill="#18223A" stroke="#2C3A5C"/>
        <text x="260" y="80" text-anchor="middle">sunset</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57;0.61;1" dur="6s" repeatCount="indefinite"/>
        <rect x="296" y="66" width="40" height="20" rx="10" fill="#18223A" stroke="#2C3A5C"/>
        <text x="316" y="80" text-anchor="middle">dog</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="6s" repeatCount="indefinite"/>
        <rect x="344" y="66" width="46" height="20" rx="10" fill="#18223A" stroke="#2C3A5C"/>
        <text x="367" y="80" text-anchor="middle">park</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.71;0.75;1" dur="6s" repeatCount="indefinite"/>
        <rect x="398" y="66" width="76" height="20" rx="10" fill="#18223A" stroke="#2C3A5C"/>
        <text x="436" y="80" text-anchor="middle">retriever</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.82;1" dur="6s" repeatCount="indefinite"/>
        <rect x="482" y="66" width="96" height="20" rx="10" fill="#18223A" stroke="#2C3A5C"/>
        <text x="530" y="80" text-anchor="middle">golden hour</text>
      </g>
    </g>

    <!-- result badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.90;1" dur="6s" repeatCount="indefinite"/>
      <rect x="980" y="34" width="196" height="28" rx="14" fill="#0E1F17" stroke="#245C36"/>
      <path d="M996 48 l4 5 l8 -10" fill="none" stroke="#3FBF6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1016" y="52" font-size="12" fill="#6EE7A0">Adobe Stock ready</text>
    </g>
  </g>
</svg>
