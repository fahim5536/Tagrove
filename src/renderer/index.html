<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Tagrove</title>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: painted before the renderer bundle loads so the window
           never flashes white. React replaces this markup on first render. -->
      <div id="splash">
        <div id="splash-wordmark">Tagrove</div>
        <div id="splash-spinner" aria-label="Loading"></div>
      </div>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0a0d13;
        color: #e6e9f0;
        font-family: system-ui, 'Segoe UI', sans-serif;
        z-index: 2147483647;
      }

      #splash-wordmark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      #splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(230, 233, 240, 0.2);
        border-top-color: #e6e9f0;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
